
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Sekolah</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f1f5f9;
      color: #1e293b;
      text-align: center;
    }

    header {
      background: #123b68;
      color: white;
      padding: 50px 20px;
    }

    main {
      max-width: 700px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .kartu {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000012;
    }

    a.tombol {
      display: inline-block;
      background: #1677d2;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      background: #e2e8f0;
    }
  </style>
</head>

<body>
  <header>
    <h1>Website Sekolah</h1>
    <p>Informasi pendidikan dalam satu halaman</p>
  </header>

  <main>
    <div class="kartu">
      <h2>Selamat Datang</h2>
      <p>
        Temukan informasi, pengumuman,
        dan layanan pendidikan sekolah kami.
      </p>
      <a class="tombol"
         href="https://github.com/">
        Kunjungi GitHub
      </a>
    </div>
  </main>

  <footer>
    &copy; 2026 Website Sekolah
  </footer>
</body>
</html>
